# Pull request security gate. Make both jobs required status checks on `main`.
name: Pull Request Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  OPA_VERSION: "1.22.4"
  TF_IN_AUTOMATION: "true"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend, lock file enforced)
        working-directory: root_module
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: root_module
        run: terraform validate

      - name: Terraform init and validate (org_guardrails)
        working-directory: org_guardrails
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Lambda unit tests
        run: python -m unittest discover -s terraform_modules/fail-closed-sweeper/tests -v

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}

      - name: OPA format
        run: opa fmt --list --fail terraform_modules/opa/policies

      - name: OPA strict check
        run: opa check --strict terraform_modules/opa/policies

      - name: OPA unit tests
        run: opa test terraform_modules/opa/policies -v

  # Plans against staging with a read-only role and evaluates the plan against
  # the OPA policies. Skipped for fork PRs, which cannot obtain OIDC credentials.
  plan:
    name: Plan and OPA gate
    needs: static
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform.yml
    with:
      environment: staging
      apply: false
      state_bucket: ${{ vars.STAGING_TF_STATE_BUCKET }}
      plan_role_arn: ${{ vars.STAGING_PLAN_ROLE_ARN }}
      aws_region: ${{ vars.TF_AWS_REGION || 'eu-west-1' }}
